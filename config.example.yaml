# Sample configuration
http:
  # HTTP server IPv4 host
  ipv4_host: "0.0.0.0"
  # HTTP server IPv6 host
  ipv6_host: "::"
  # HTTP server port
  port: 8080
  tracing:
    # Enable OpenTelemetry tracing
    enabled: false
    # OpenTelemetry OTLP endpoint
    # otlp_endpoint: ""
  pprof:
    # Enable pprof on the HTTP server
    enabled: false
  # Comma-separated list of trusted proxy IPs or CIDRs
  # trusted_proxies: []
  metrics:
    # Metrics server IPv4 host
    ipv4_host: "127.0.0.1"
    # Metrics server IPv6 host
    ipv6_host: "::1"
    # Metrics server port
    port: 8081
    # Enable the metrics server
    enabled: false
  # Deprecated alias of http.tracing.enabled
  enabled: false
  # Deprecated alias of http.tracing.otlp_endpoint
  # otlp_endpoint: ""
# Rules that run an action when a firing AlertManager webhook matches them. Only settable in the config file.
